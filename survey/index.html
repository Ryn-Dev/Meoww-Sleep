<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <meta name="robots" content="noindex">
  <meta name="description" content="Kuesioner kepuasan pengguna LMS: menilai kemudahan belajar, efisiensi mengajar, dan kualitas informasi.">
  <title>Kuesioner Kepuasan LMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/style.css">
  <script>
    (function () {
      var t = 'light';
      try {
        t = localStorage.getItem('lms_theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#stage">Lewati ke formulir</a>

  <div class="shell">
    <header class="topbar">
      <div class="topbar__row">
        <div class="brand">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H19v15.5H6.5A2.5 2.5 0 0 0 4 21z"/>
              <path d="M8 8h7M8 12h5"/>
            </svg>
          </span>
          <span class="brand__text">
            <strong>Kuesioner LMS</strong>
            <small>Evaluasi pengalaman pengguna</small>
          </span>
        </div>
        <div class="topbar__actions">
          <button type="button" class="btn-theme" id="btnThemeToggle" aria-label="Ganti tema gelap/terang" title="Ganti tema gelap/terang">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
            </svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>
            </svg>
          </button>
          <span class="badge" id="progressLabel" hidden>Bagian 1</span>
        </div>
      </div>

      <div class="progress" id="progressWrap" hidden>
        <div class="progress__track">
          <span class="progress__bar" id="progressBar" style="width:0%"></span>
        </div>
      </div>
    </header>

    <main class="card" id="stage" tabindex="-1" aria-live="polite"></main>

    <nav class="nav" id="nav" aria-label="Navigasi formulir">
      <button type="button" class="btn btn--ghost" id="btnBack" hidden>Kembali</button>
      <button type="button" class="btn btn--primary" id="btnNext">Mulai</button>
    </nav>

    <p class="footnote">
      Data dan masukan yang Anda berikan hanya dipergunakan untuk evaluasi serta peningkatan kualitas pelayanan LMS.
    </p>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="./assets/config.js"></script>
  <script src="./assets/questions.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
